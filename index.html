<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEO Meta Description Writer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>SEO Meta Description Writer</h1>
    <p class="subtitle">
      Paste your page content or a URL. Get three optimised meta descriptions (150–155 characters).
    </p>

    <textarea id="inputText" placeholder="Paste your page content here…" rows="8"></textarea>

    <button id="generateBtn">Generate Meta Descriptions</button>

    <div id="status" class="status"></div>

    <section id="results" class="results hidden">
      <h2>Generated Descriptions</h2>
      <div id="outputContainer"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
